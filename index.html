<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Internship Board</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Internship Board</h1>
        <p>Find your next learning opportunity</p>
    </header>

    <main class="container">

        <section class="search-section">
            <h2>Explore Internships</h2>

            <label for="search">Search internships</label>
            <input
                type="search"
                id="search"
                placeholder="Search by role, skill or location..."
            >

            <label for="domain-filter">Filter by domain</label>
            <select id="domain-filter">
                <option value="all">All Domains</option>
            </select>
        </section>

        <p id="status" role="status" aria-live="polite">
            Loading internships...
        </p>

        <section
            id="internship-list"
            class="internship-list"
            aria-label="Available internships">
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
